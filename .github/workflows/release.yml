# Builds DropLink's installers and attaches them to a GitHub release:
#   Windows: the Inno Setup installer + latest.json, signed for self-update
#   Linux:   .deb, .rpm and .AppImage, plus the Arch package
#            (droplink-bin .pkg.tar.zst, built from an AUR PKGBUILD in an Arch
#            container; the PKGBUILD and .SRCINFO are attached too)
#
# Runs when a v* tag is pushed (building that tag), or by hand (Actions >
# release > Run workflow), which builds the branch it is run from and
# replaces the files of the named tag's release.
#
# Needs one repository secret, DROPLINK_UPDATE_KEY: the contents of the
# release signing key (~/.droplink/update-signing.key). See README,
# "Making a release".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0 (the release is created if missing)"
        required: true
      notes:
        description: "Short notes for the in-app update dialog"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Version matches the tag
        shell: bash
        run: |
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::tauri.conf.json is $v but the tag is $TAG"; exit 1; }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: bash
        run: |
          (cd desktop && npm install --no-fund --no-audit)
          go run ./tools/release build
      - name: Sign latest.json
        shell: bash
        env:
          KEY: ${{ secrets.DROPLINK_UPDATE_KEY }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the DROPLINK_UPDATE_KEY repository secret (README, Making a release)"
            exit 1
          fi
          key="$RUNNER_TEMP/update-signing.key"
          printf '%s\n' "$KEY" > "$key"
          DROPLINK_UPDATE_KEY="$key" go run ./tools/release sign -notes "${NOTES:-DropLink ${TAG#v}}"
          rm -f "$key"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/latest.json
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Build .deb, .rpm and .AppImage
        run: |
          v=${TAG#v}
          DROPLINK_VERSION=$v go run ./tools/buildsidecar
          (cd desktop && npm install --no-fund --no-audit && npx tauri build --bundles deb,rpm,appimage)
          mkdir -p dist
          b=desktop/src-tauri/target/release/bundle
          cp "$(ls $b/deb/*.deb | head -1)" "dist/droplink-$v-linux-amd64.deb"
          cp "$(ls $b/rpm/*.rpm | head -1)" "dist/droplink-$v-linux-amd64.rpm"
          cp "$(ls $b/appimage/*.AppImage | head -1)" "dist/droplink-$v-linux-amd64.AppImage"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/droplink-*-linux-*
          if-no-files-found: error

  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Build the AUR package from the .deb
        run: |
          pacman -Syu --noconfirm --needed base-devel
          v=${TAG#v}
          work=/tmp/aur
          mkdir -p "$work"
          deb="droplink-$v-linux-amd64.deb"
          cp "dist/$deb" "$work/"
          cp LICENSE "$work/LICENSE-$v"
          sed -e "s/@VERSION@/$v/" -e "s/@DEB_SHA256@/$(sha256sum "dist/$deb" | cut -d' ' -f1)/" -e "s/@LICENSE_SHA256@/$(sha256sum LICENSE | cut -d' ' -f1)/" packaging/arch/PKGBUILD.in > "$work/PKGBUILD"
          useradd -m builder
          chown -R builder "$work"
          # The sources are already in place, so makepkg checks their
          # sums without downloading; --nodeps skips installing GTK.
          su builder -c "cd $work && makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO"
          bsdtar -tf "$work"/droplink-bin-$v-1-x86_64.pkg.tar.zst | grep -E 'usr/bin/|licenses/'
          mkdir -p out
          cp "$work/PKGBUILD" out/droplink-bin.PKGBUILD
          cp "$work/.SRCINFO" out/droplink-bin.SRCINFO
          cp "$work"/droplink-bin-$v-1-x86_64.pkg.tar.zst out/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/droplink-bin*
          if-no-files-found: error

  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        run: |
          ls -l dist
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "DropLink ${TAG#v}" --notes "DropLink ${TAG#v}" --verify-tag
          gh release upload "$TAG" dist/* --clobber
